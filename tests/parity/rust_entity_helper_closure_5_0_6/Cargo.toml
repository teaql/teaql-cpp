[package]
name = "teaql_entity_helper_closure_506"
version = "0.1.0"
edition = "2024"
publish = false

# Compile the original entity-only access harness unchanged. This independent
# manifest uses the current reference registry versions; the historical project
# and the generated Rust entity/Checker bodies remain untouched.
[lib]
name = "cpp_types_core"
path = "../rust_types_entities/src/lib.rs"

[[bin]]
name = "entity_helpers_506"
path = "../rust_field_layout/src/bin/generated_entity_helpers_5_0_6.rs"

[dependencies]
teaql-core = { path = "../../../.reference/teaql-rs/teaql-core" }
teaql-runtime = { path = "../../../.reference/teaql-rs/teaql-runtime" }
teaql-macros = { path = "../../../.reference/teaql-rs/teaql-macros" }
serde_json = "=1.0.150"
serde = { version = "=1.0.228", features = ["derive"] }
chrono = "=0.4.45"
rust_decimal = "=1.42.1"
cpp_relations_core = { package = "cpp-relations-core", path = "../../generator/parity/relations_rust/lib" }

[workspace]

[patch.crates-io]
teaql-core = { path = "../../../.reference/teaql-rs/teaql-core" }
teaql-runtime = { path = "../../../.reference/teaql-rs/teaql-runtime" }
teaql-macros = { path = "../../../.reference/teaql-rs/teaql-macros" }
teaql-sql = { path = "../../../.reference/teaql-rs/teaql-sql" }
teaql-data-service = { path = "../../../.reference/teaql-rs/teaql-data-service" }
teaql-provider-sqlite = { path = "../../../.reference/teaql-rs/teaql-provider-sqlite" }
