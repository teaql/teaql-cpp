[package]
name = "teaql-cpp-value-oracle"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
teaql-core = { path = "../../../.reference/teaql-rs/teaql-core" }
teaql-data-service = { path = "../../../.reference/teaql-rs/teaql-data-service" }
teaql-sql = { path = "../../../.reference/teaql-rs/teaql-sql" }
# Already a provider dependency; direct import for runtime Context oracle only.
teaql-runtime = { path = "../../../.reference/teaql-rs/teaql-runtime" }
chrono = "=0.4.45"
rust_decimal = "=1.42.1"
# Oracle-only: invoke the enabled locked Decimal reciprocal trait directly.
num-traits = "=0.2.19"
serde_json = "=1.0.150"
# Oracle-only Stream fixture; already used transitively by pinned teaql-sql.
futures-core = "=0.3.34"
# Oracle-only actual SQLite provider and its upstream-locked driver. These
# validate public binding behavior; neither is a C++ production dependency.
teaql-provider-sqlite = { path = "../../../.reference/teaql-rs/teaql-provider-sqlite" }
rusqlite = "=0.40.1"
libsqlite3-sys = "=0.38.1"

# Oracle-only direct import needed to compile the pinned private log-privacy module.
# Already locked as a runtime dependency; no C++ production dependency.
sha2 = "=0.10.9"

# Oracle-only task-local future; already present in the locked Rust runtime.
tokio = "=1.53.1"

# Oracle-only macro already locked by teaql-runtime; compiles its original
# asynchronous pagination store interfaces. No C++ runtime dependency.
async-trait = "=0.1.92"

# Oracle-only direct import of the runtime's already locked asynchronous mutex.
futures-util = "=0.3.34"

# Oracle-only: use unchanged derive mappings from the locked example library.
teaql-macros = { path = "../../../.reference/teaql-rs/teaql-macros" }

# Oracle-only: already locked by the original runtime; manufacture authenticated
# malformed payload fixtures without copying either original codec.
aes-gcm = "=0.10.3"
base64 = "=0.22.1"
# Oracle-only existing runtime dependency for authenticated round-trip fixtures.
hkdf = "=0.12.4"

[workspace]
